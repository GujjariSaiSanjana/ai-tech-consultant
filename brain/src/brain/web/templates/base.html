<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Knowledge Brain{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    :root { --fg:#1d232b; --muted:#5b6673; --line:#dfe3e8; --bg:#f7f8fa; --card:#fff; --accent:#1f5fbf;
            --ok:#1d7a46; --warn:#9a5b00; --bad:#a32020; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--fg);
           background:var(--bg); }
    header { background:var(--card); border-bottom:1px solid var(--line); }
    header .wrap { display:flex; gap:1rem; align-items:center; justify-content:space-between; }
    header a { color:var(--fg); text-decoration:none; font-weight:600; }
    nav a { font-weight:500; color:var(--accent); margin-left:1rem; }
    .wrap { max-width:760px; margin:0 auto; padding:0.9rem 1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem;
            margin:1rem 0; }
    textarea, input[type=text] { width:100%; font:inherit; padding:0.6rem; border:1px solid var(--line);
            border-radius:8px; }
    textarea { min-height:5rem; resize:vertical; }
    button { font:inherit; padding:0.5rem 0.9rem; border-radius:8px; border:1px solid var(--accent);
             background:var(--accent); color:#fff; cursor:pointer; }
    button.secondary { background:#fff; color:var(--accent); }
    .row { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; margin-top:0.6rem; }
    .badge { display:inline-block; font-size:0.8rem; padding:0.1rem 0.55rem; border-radius:999px;
             border:1px solid var(--line); background:var(--bg); }
    .badge.setting { color:var(--ok); border-color:var(--ok); }
    .badge.addon, .badge.widget_customization { color:var(--warn); border-color:var(--warn); }
    .badge.custom_dev { color:var(--bad); border-color:var(--bad); }
    .muted { color:var(--muted); font-size:0.9rem; }
    .answer { white-space:pre-wrap; }
    .warning { border-left:3px solid var(--warn); padding:0.3rem 0.6rem; background:#fff8ec; margin:0.4rem 0; }
    ol.cites { padding-left:1.3rem; } ol.cites li { margin:0.4rem 0; }
    blockquote { margin:0.2rem 0 0; padding-left:0.6rem; border-left:2px solid var(--line); color:var(--muted); }
    .path { font-family:ui-monospace,Menlo,monospace; font-size:0.9rem; background:var(--bg); padding:0.1rem 0.3rem;
            border-radius:4px; }
    .htmx-request .spinner { display:inline; } .spinner { display:none; }
  </style>
</head>
<body>
  <header><div class="wrap"><a href="/">Knowledge Brain</a>
    <nav><a href="/">Ask</a><a href="/experts">Expert queue</a></nav></div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
