# Render Blueprint: a temporary, free-tier demo deployment of all three tasks.
# Deploy: Render dashboard > New > Blueprint > pick this repo. See docs/DEPLOY.md.
#
# Start commands live in <app>/deploy/render-start.sh: Render does not run dockerCommand through
# a full shell, so it must stay a plain command with no quotes or variables.
#
# Free-tier trade-offs, on purpose:
# - services sleep after 15 idle minutes (first request then takes 30-60 s);
# - inbox and scope keep SQLite on an ephemeral disk, so they reseed demo data on every start;
# - no background worker, so the nightly help-center sync does not run (the Brain is loaded once).

envVarGroups:
  - name: ai-tc-shared
    envVars:
      - key: BRAIN_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_FALLBACK_ORDER
        value: gemini,nvidia

databases:
  - name: ai-tc-brain-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: brain
    user: brain

services:
  - type: web
    name: ai-tc-brain
    runtime: docker
    plan: free
    region: singapore
    rootDir: brain
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/deploy/render-start.sh  # migrate, then serve
    healthCheckPath: /health
    envVars:
      - fromGroup: ai-tc-shared
      - key: BRAIN_DATABASE_URL
        fromDatabase:
          name: ai-tc-brain-db
          property: connectionString
      - key: PORT
        value: "8000"
      - key: BRAIN_PORT
        value: "8000"
      - key: BRAIN_URL
        value: https://ai-tc-brain.onrender.com

  - type: web
    name: ai-tc-inbox
    runtime: docker
    plan: free
    region: singapore
    rootDir: inbox
    dockerfilePath: ./Dockerfile
    # Reseeds the demo inbox (offline, simulated history) on each start, then serves the app.
    dockerCommand: sh /app/deploy/render-start.sh
    healthCheckPath: /inbox
    envVars:
      - fromGroup: ai-tc-shared
      - key: PORT
        value: "3000"
      - key: INBOX_BRAIN_MODE
        value: http
      - key: BRAIN_URL
        value: https://ai-tc-brain.onrender.com

  - type: web
    name: ai-tc-scope
    runtime: docker
    plan: free
    region: singapore
    rootDir: scope
    dockerfilePath: ./Dockerfile
    # Rebuilds the Trailhead demo project offline on each start, so the UI is never empty.
    dockerCommand: sh /app/deploy/render-start.sh
    healthCheckPath: /
    envVars:
      - fromGroup: ai-tc-shared
      - key: PORT
        value: "8100"
      - key: SCOPE_BRAIN
        value: http
      - key: BRAIN_URL
        value: https://ai-tc-brain.onrender.com
